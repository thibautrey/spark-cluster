{{- if .Values.runtime.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: spark-cluster-ray-head
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: spark-cluster-runtime, app.kubernetes.io/component: head }
  ports:
    - { name: ray, port: 6379, targetPort: ray }
    - { name: api, port: 8000, targetPort: api }
---
apiVersion: v1
kind: Service
metadata:
  name: spark-cluster-openai
spec:
  type: {{ .Values.runtime.service.type }}
  selector: { app.kubernetes.io/name: spark-cluster-runtime, app.kubernetes.io/component: head }
  ports:
    - name: openai
      port: {{ .Values.runtime.service.port }}
      targetPort: api
      {{- if and (eq .Values.runtime.service.type "NodePort") .Values.runtime.service.nodePort }}
      nodePort: {{ .Values.runtime.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-cluster-runtime-head
spec:
  replicas: {{ ternary 0 1 .Values.runtime.deferStart }}
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: spark-cluster-runtime, app.kubernetes.io/component: head }
  template:
    metadata:
      labels: { app.kubernetes.io/name: spark-cluster-runtime, app.kubernetes.io/component: head }
    spec:
      {{- if .Values.runtime.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      runtimeClassName: nvidia
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app.kubernetes.io/name: spark-cluster-runtime } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: engine
          image: "{{ .Values.runtime.image.repository }}:{{ .Values.runtime.image.tag }}"
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          command: [bash, -lc]
          args:
            - |
              ray start --head --node-ip-address="$NODE_IP" --port=6379 --dashboard-host=0.0.0.0
              exec python -m vllm.entrypoints.openai.api_server \
                --model "$MODEL_ID" \
                --served-model-name "$SERVED_MODEL_NAME" \
                --distributed-executor-backend ray \
                --tensor-parallel-size "$TENSOR_PARALLEL_SIZE" \
                --pipeline-parallel-size "$PIPELINE_PARALLEL_SIZE" \
                --max-model-len "$MAX_MODEL_LEN" \
                --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION" \
                --kv-cache-dtype "$KV_CACHE_DTYPE" \
                --max-num-seqs "$MAX_NUM_SEQS" \
                --max-num-batched-tokens "$MAX_NUM_BATCHED_TOKENS" \
                --enable-prefix-caching \
                --kv-transfer-config '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}' \
                --host 0.0.0.0 --port 8000
          env:
            - { name: NODE_IP, valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
            - { name: VLLM_USE_V1, value: "1" }
            - { name: LMCACHE_CONFIG_FILE, value: /etc/lmcache/lmcache.yaml }
            - { name: MODEL_ID, value: {{ .Values.runtime.model | quote }} }
            - { name: SERVED_MODEL_NAME, value: {{ .Values.runtime.servedModelName | quote }} }
            - { name: TENSOR_PARALLEL_SIZE, value: {{ .Values.runtime.tensorParallelSize | quote }} }
            - { name: PIPELINE_PARALLEL_SIZE, value: {{ .Values.runtime.pipelineParallelSize | quote }} }
            - { name: MAX_MODEL_LEN, value: {{ .Values.runtime.maxModelLen | quote }} }
            - { name: GPU_MEMORY_UTILIZATION, value: {{ .Values.runtime.gpuMemoryUtilization | quote }} }
            - { name: KV_CACHE_DTYPE, value: {{ .Values.runtime.kvCacheDtype | quote }} }
            - { name: MAX_NUM_SEQS, value: {{ .Values.runtime.maxNumSeqs | quote }} }
            - { name: MAX_NUM_BATCHED_TOKENS, value: {{ .Values.runtime.maxNumBatchedTokens | quote }} }
            - { name: NCCL_NET, value: IB }
            - { name: NCCL_IB_DISABLE, value: "0" }
            - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          ports: [{ name: ray, containerPort: 6379 }, { name: api, containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: api }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 360
          resources:
            limits: { nvidia.com/gpu: 1 }
            requests: { nvidia.com/gpu: 1, memory: 96Gi, cpu: "8" }
          volumeMounts:
            - { name: lmcache-config, mountPath: /etc/lmcache }
            - { name: lmcache, mountPath: /var/lib/lmcache }
            - { name: models, mountPath: {{ .Values.models.mountPath }}, readOnly: true }
      volumes:
        - { name: lmcache-config, configMap: { name: spark-cluster-runtime } }
        - { name: lmcache, hostPath: { path: {{ .Values.runtime.cache.hostPath }}, type: DirectoryOrCreate } }
        - name: models
          {{- if .Values.models.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ default "spark-cluster-models" .Values.models.persistence.existingClaim }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
      nodeSelector: {{- toYaml .Values.runtime.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.runtime.tolerations | nindent 8 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-cluster-runtime-worker
spec:
  serviceName: spark-cluster-ray-head
  podManagementPolicy: Parallel
  replicas: {{ ternary 0 (int (sub (mul .Values.runtime.tensorParallelSize .Values.runtime.pipelineParallelSize) 1)) .Values.runtime.deferStart }}
  selector:
    matchLabels: { app.kubernetes.io/name: spark-cluster-runtime, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: spark-cluster-runtime, app.kubernetes.io/component: worker }
    spec:
      {{- if .Values.runtime.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      runtimeClassName: nvidia
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app.kubernetes.io/name: spark-cluster-runtime } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ray-worker
          image: "{{ .Values.runtime.image.repository }}:{{ .Values.runtime.image.tag }}"
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          command: [bash, -lc]
          args: ["until (echo > /dev/tcp/spark-cluster-ray-head/6379) 2>/dev/null; do sleep 2; done; exec ray start --node-ip-address=$NODE_IP --address=spark-cluster-ray-head:6379 --block"]
          env:
            - { name: NODE_IP, valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
            - { name: VLLM_USE_V1, value: "1" }
            - { name: LMCACHE_CONFIG_FILE, value: /etc/lmcache/lmcache.yaml }
            - { name: NCCL_NET, value: IB }
            - { name: NCCL_IB_DISABLE, value: "0" }
            - { name: NCCL_IB_ROCE_VERSION_NUM, value: "2" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          resources:
            limits: { nvidia.com/gpu: 1 }
            requests: { nvidia.com/gpu: 1, memory: 96Gi, cpu: "8" }
          volumeMounts:
            - { name: lmcache-config, mountPath: /etc/lmcache }
            - { name: lmcache, mountPath: /var/lib/lmcache }
            - { name: models, mountPath: {{ .Values.models.mountPath }}, readOnly: true }
      volumes:
        - { name: lmcache-config, configMap: { name: spark-cluster-runtime } }
        - { name: lmcache, hostPath: { path: {{ .Values.runtime.cache.hostPath }}, type: DirectoryOrCreate } }
        - name: models
          {{- if .Values.models.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ default "spark-cluster-models" .Values.models.persistence.existingClaim }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
      nodeSelector: {{- toYaml .Values.runtime.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.runtime.tolerations | nindent 8 }}
{{- end }}
