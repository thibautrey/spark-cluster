{{- $token := randAlphaNum 40 -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "spark-deepseek-ingest" -}}
{{- if $existing -}}
{{- $token = (index $existing.data "token" | b64dec) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: spark-deepseek-ingest
type: Opaque
stringData:
  token: {{ $token | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-deepseek-runtime
data:
  lmcache.yaml: |
    chunk_size: 256
    local_cpu: true
    max_local_cpu_size: {{ .Values.runtime.cache.cpuGiB }}
    local_disk: "file:///var/lib/lmcache"
    max_local_disk_size: {{ .Values.runtime.cache.diskGiB }}
    save_decode_cache: true
    enable_blending: true
    {{- if .Values.runtime.cache.remoteUrl }}
    remote_url: {{ .Values.runtime.cache.remoteUrl | quote }}
    remote_serde: {{ .Values.runtime.cache.remoteSerde | quote }}
    {{- end }}
  runtime.env: |
    MODEL_ID={{ .Values.runtime.model }}
    SERVED_MODEL_NAME={{ .Values.runtime.servedModelName }}
    MAX_MODEL_LEN={{ .Values.runtime.maxModelLen }}
    TENSOR_PARALLEL_SIZE={{ .Values.runtime.tensorParallelSize }}
    PIPELINE_PARALLEL_SIZE={{ .Values.runtime.pipelineParallelSize }}
    GPU_MEMORY_UTILIZATION={{ .Values.runtime.gpuMemoryUtilization }}
{{- if .Values.controlPlane.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spark-deepseek
spec:
  {{- if .Values.controlPlane.ingress.className }}
  ingressClassName: {{ .Values.controlPlane.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.controlPlane.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: spark-deepseek, port: { name: http } } }
{{- end }}
