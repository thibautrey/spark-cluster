image:
  repository: ghcr.io/thibautrey/spark-deepseek
  tag: latest
  pullPolicy: IfNotPresent

controlPlane:
  replicas: 1
  mode: live
  runtimeLogsMode: auto
  runtimeControlMode: auto
  service:
    type: ClusterIP
    port: 8080
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  ingress:
    enabled: false
    className: ""
    host: spark-deepseek.local
    tlsSecret: ""

agent:
  enabled: true
  intervalSeconds: 2
  nodeSelector: {}
  tolerations: []

models:
  mountPath: /models
  hfTokenSecret: ""
  adminTokenSecret: ""
  persistence:
    enabled: true
    existingClaim: ""
    size: 1Ti
    storageClass: ""
    accessModes: [ReadWriteMany]

runtime:
  enabled: false
  image:
    repository: nvcr.io/nvidia/vllm
    tag: 25.09-py3
    pullPolicy: IfNotPresent
  model: deepseek-ai/DeepSeek-R1
  servedModelName: deepseek-r1
  maxModelLen: 524288
  tensorParallelSize: 4
  pipelineParallelSize: 1
  gpuMemoryUtilization: 0.82
  openAIBaseUrl: http://spark-deepseek-openai:8000/v1
  apiKeySecret: ""
  service:
    type: ClusterIP
    port: 8000
  cache:
    cpuGiB: 32
    diskGiB: 1536
    hostPath: /var/lib/spark-deepseek/lmcache
    remoteUrl: ""
    remoteSerde: cachegen
  nodeSelector: {}
  tolerations: []

resources:
  controlPlane:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  agent:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
