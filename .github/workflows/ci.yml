name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=spark_deepseek --cov-report=term-missing
      - run: docker build -t spark-deepseek:ci .
