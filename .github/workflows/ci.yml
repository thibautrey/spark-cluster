name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=spark_cluster --cov-report=term-missing
      - run: docker build -t spark-cluster:ci .
