services:
  control-plane:
    build: .
    environment:
      SPARK_DEEPSEEK_MODE: demo
      SPARK_DEEPSEEK_DATABASE_PATH: /data/spark-deepseek.db
      SPARK_DEEPSEEK_CLUSTER_NAME: gb10-lab
      SPARK_DEEPSEEK_OPENAI_API_BASE: http://localhost:8000/v1
      SPARK_DEEPSEEK_MODEL_CACHE_PATH: /models
    ports:
      - "8080:8080"
    volumes:
      - dashboard-data:/data
      - model-cache:/models
    restart: unless-stopped

volumes:
  dashboard-data:
  model-cache:
