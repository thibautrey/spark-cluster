[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spark-deepseek"
version = "0.1.0"
description = "A persistent KV-cache control plane and cluster dashboard for DeepSeek on NVIDIA GB10 systems."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Thibaut Rey" }]
keywords = ["deepseek", "dgx-spark", "gb10", "vllm", "lmcache", "kv-cache"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.27,<2",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<18",
  "zeroconf>=0.148,<1",
]

[project.optional-dependencies]
agent = ["nvidia-ml-py>=12.560"]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6", "ruff>=0.9"]

[project.scripts]
spark-deepseek = "spark_deepseek.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_deepseek"]
artifacts = ["src/spark_deepseek/chart/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
