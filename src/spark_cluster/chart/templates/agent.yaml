{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spark-cluster-agent
  labels: {{- include "spark-cluster.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: spark-cluster, app.kubernetes.io/component: agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: spark-cluster, app.kubernetes.io/component: agent }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      runtimeClassName: nvidia
      containers:
        - name: agent
          image: {{ include "spark-cluster.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["agent", "--server", "http://spark-cluster:8080", "--node-id", "$(NODE_NAME)", "--interval", {{ .Values.agent.intervalSeconds | quote }}]
          env:
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: NVIDIA_VISIBLE_DEVICES, value: all }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: utility,compute }
            - name: SPARK_CLUSTER_INGEST_TOKEN
              valueFrom: { secretKeyRef: { name: spark-cluster-ingest, key: token } }
          resources: {{- toYaml .Values.resources.agent | nindent 12 }}
      nodeSelector: {{- toYaml .Values.agent.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.agent.tolerations | nindent 8 }}
{{- end }}
