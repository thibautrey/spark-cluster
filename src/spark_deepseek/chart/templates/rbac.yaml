apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-deepseek
  labels: {{- include "spark-deepseek.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-deepseek-runtime-control
  labels: {{- include "spark-deepseek.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [spark-deepseek-runtime-head]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [spark-deepseek-runtime-worker]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-deepseek-runtime-control
  labels: {{- include "spark-deepseek.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: spark-deepseek
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-deepseek-runtime-control
